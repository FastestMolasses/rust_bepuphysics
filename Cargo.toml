[workspace]
members = ["benchmarks"]
default-members = ["."]

[package]
name = "rust_bepuphysics"
version = "0.1.0"
edition = "2021"

[features]
default = []
bevy = ["dep:bevy"]
profile = []

[dependencies]
glam = "0.32"
num-traits = "0.2"
bevy = { version = "0.19", optional = true, default-features = false, features = ["std", "bevy_log"] }

[dev-dependencies]
bevy = "0.19"
rand = "0.9"

[[example]]
name = "tower"
required-features = ["bevy"]

[[example]]
name = "rain"
required-features = ["bevy"]

[[example]]
name = "hello_physics"
required-features = ["bevy"]
