[package]
name = "bepu-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
# Off by default: bepuvy-sys links a prebuilt native library that fails to link on MSVC.
csharp = ["dep:bepuvy-sys"]

[dependencies]
bevy = "0.19"
rand = "0.9"
avian3d = "0.7"
bepuvy-sys = { git = "https://github.com/DrewRidley/bepuvy-sys.git", rev = "bdb4f4d", optional = true }

[[example]]
name = "rain_csharp"
required-features = ["csharp"]
